[project]
name = "inkdrop-backend"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "asyncpg>=0.32.0",
    "beautifulsoup4>=4.15.0",
    "celery[redis]>=5.7.0",
    "fastapi[standard]>=0.162.5",
    "httpx>=0.28.1",
    "pwdlib[argon2]>=0.4.0",
    "pydantic-settings>=2.16.2",
    "redis>=8.1.0",
    "resend>=2.55.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "ruff>=0.17.5",
]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
